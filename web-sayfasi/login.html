<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mektep Kütüphanesi - Giriş Portalı</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Dancing+Script:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #07090e;
            --text: #f5f6fa;
            --accent: #ffc107;
            --accent-glow: rgba(255, 193, 7, 0.35);
            --card-bg: rgba(18, 24, 38, 0.65);
            --border: rgba(255, 255, 255, 0.08);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle at 50% 30%, #121724 0%, #06080d 80%, #030406 100%);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        .portal-container {
            width: min(520px, 92vw);
            text-align: center;
            padding: 40px 20px;
            z-index: 10;
        }

        header h1 {
            margin: 0;
            font-family: 'Cinzel', serif;
            font-size: 2.3rem;
            font-weight: 700;
            letter-spacing: 4px;
            color: #fff;
            text-shadow: 0 0 25px rgba(255, 193, 7, 0.3);
        }

        header .subtitle {
            font-family: 'Dancing Script', cursive;
            font-size: 1.6rem;
            color: var(--accent);
            margin-top: 6px;
            margin-bottom: 30px;
        }

        /* Glassmorphic Portal Box */
        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 30px 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6),
                        inset 0 1px 2px rgba(255, 255, 255, 0.1);
            transition: 0.3s ease;
        }

        .card-title {
            font-size: 1.15rem;
            font-weight: 600;
            color: #fff;
            margin-bottom: 24px;
        }

        /* Portal Roles Grid */
        .roles-grid {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .role-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text);
            border-radius: 12px;
            padding: 18px 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.25, 1, 0.5, 1);
            text-align: left;
        }

        .role-btn:hover {
            background: rgba(255, 193, 7, 0.08);
            border-color: var(--accent);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 193, 7, 0.12);
        }

        .role-btn .icon {
            font-size: 1.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 10px;
        }

        .role-btn:hover .icon {
            background: var(--accent);
            color: #000;
        }

        .role-btn .details h4 {
            margin: 0;
            font-size: 0.95rem;
            font-weight: 600;
            color: #fff;
        }

        .role-btn .details p {
            margin: 3px 0 0 0;
            font-size: 0.78rem;
            color: #a4b0be;
        }

        /* Form Area */
        .form-area {
            display: none;
            text-align: left;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 0.82rem;
            font-weight: 600;
            color: #a4b0be;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        .form-group input {
            width: 100%;
            background: rgba(22, 27, 38, 0.8);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 0.95rem;
            outline: none;
            transition: 0.2s;
        }

        .form-group input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .btn-submit {
            width: 100%;
            background: var(--accent);
            color: #000;
            border: none;
            border-radius: 8px;
            padding: 13px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 8px;
        }

        .btn-submit:hover {
            box-shadow: 0 0 15px var(--accent-glow);
            transform: translateY(-1px);
        }

        .btn-back {
            display: inline-block;
            background: none;
            border: none;
            color: #8a8a9e;
            font-size: 0.85rem;
            cursor: pointer;
            margin-top: 16px;
            font-weight: 600;
        }
        .btn-back:hover {
            color: #fff;
        }

        .error-message {
            color: #ff6b6b;
            font-size: 0.82rem;
            margin-top: 10px;
            text-align: center;
            display: none;
        }

        .bottom-decor {
            position: absolute;
            bottom: -150px;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(255, 193, 7, 0.05) 0%, rgba(255, 193, 7, 0) 70%);
            border-radius: 50%;
            z-index: 1;
        }

        /* ── Telefon düzeni (2026-08-06'da eklendi) ──
           Bu sayfada hiç medya sorgusu yoktu. 375px'lik ekranda:
           - dekoratif ışık halkası 600px sabit genişlikteydi ve sayfayı
             112px yana kaydırıyordu (asıl yatay kayma sebebi),
           - "MEKTEP KÜTÜPHANESİ" başlığı kendi kutusundan 23px taşıyordu. */
        @media (max-width: 600px) {
            .bottom-decor {
                width: 100vw;
                height: 100vw;
                bottom: -60px;
            }
            header h1 {
                font-size: 1.7rem;
                letter-spacing: 2px;
                line-height: 1.25;
                overflow-wrap: break-word;
            }
            .portal-container { padding: 30px 14px; }
        }
        @media (max-width: 380px) {
            header h1 { font-size: 1.5rem; letter-spacing: 1.5px; }
        }
    </style>
</head>
<body>
    <!-- 2026-08-06: Sol ve sağ üst köşedeki iki ÖZKURBİR logosu kullanıcı
         isteğiyle kaldırıldı (telefonda başlığın üzerine biniyor, masaüstünde
         de sayfayı kalabalıklaştırıyordu). Kurum kimliği zaten kitap
         kapaklarında ve künye sayfasında yer alıyor. Geri istenirse:
         <img src="a-logo.png" alt="ÖZKURBİR" class="portal-logo"> -->
    <div class="portal-container">
        <header>
            <h1>MEKTEP KÜTÜPHANESİ</h1>
            <div class="subtitle">E-Kitapçık Portalı</div>
        </header>

        <div class="glass-card" id="card-box">
            <!-- 1. Giriş Seçenekleri -->
            <div id="role-selection">
                <div class="card-title">Lütfen Giriş Rolünüzü Seçin</div>
                <div class="roles-grid">
                    <button class="role-btn" onclick="selectRole('reader')">
                        <div class="icon">📖</div>
                        <div class="details">
                            <h4>Okuyucu Girişi</h4>
                            <p>Sadece okuma ve inceleme (Şifresiz)</p>
                        </div>
                    </button>
                    <button class="role-btn" onclick="selectRole('author')">
                        <div class="icon">✍️</div>
                        <div class="details">
                            <h4>Yazar Girişi</h4>
                            <p>Kendi yazılarınızı düzenleme ve kaydetme</p>
                        </div>
                    </button>
                    <button class="role-btn" onclick="selectRole('admin')">
                        <div class="icon">⚙️</div>
                        <div class="details">
                            <h4>Yönetici Girişi</h4>
                            <p>Tüm yetkiler, istatistikler ve güncellemeler</p>
                        </div>
                    </button>
                </div>
            </div>

            <!-- 2. Giriş Formu (Yazar ve Yönetici için) -->
            <div id="login-form-area" class="form-area">
                <div class="card-title" id="form-title">Giriş Yap</div>
                
                <div class="form-group">
                    <label id="lbl-username" for="username">Kullanıcı Adı</label>
                    <input type="text" id="username" placeholder="Kullanıcı adınızı girin">
                </div>
                
                <div class="form-group">
                    <label for="password">Şifre</label>
                    <input type="password" id="password" placeholder="Şifrenizi girin">
                </div>

                <button class="btn-submit" onclick="submitLogin()">Giriş Yap 🚀</button>
                <div class="error-message" id="err-box">Hatalı kullanıcı adı veya şifre!</div>

                <div style="text-align: center;">
                    <button class="btn-back" onclick="showRoles()">← Geri Dön</button>
                </div>
            </div>
        </div>
    </div>

    <div class="bottom-decor"></div>

    <!-- build_library.js tarafından üretilir; sunucusuz kullanımda (dosya://
         veya statik host) yazar kullanıcı adını doğrulamak için gerekli.
         ŞİFRE İÇERMEZ. -->
    <script src="yazar_kullanicilari.js"></script>
    <script>
        // Temizle
        localStorage.removeItem('userRole');
        localStorage.removeItem('username');
        localStorage.removeItem('password');
        localStorage.removeItem('authorRealName');
        localStorage.removeItem('authorId');

        let selectedRole = '';

        function selectRole(role) {
            selectedRole = role;
            if (role === 'reader') {
                localStorage.setItem('userRole', 'reader');
                window.location.href = 'mektep_kutuphane.html';
            } else {
                document.getElementById('role-selection').style.display = 'none';
                document.getElementById('login-form-area').style.display = 'block';
                document.getElementById('err-box').style.display = 'none';
                
                if (role === 'admin') {
                    document.getElementById('form-title').textContent = '⚙️ Yönetici Girişi';
                    document.getElementById('lbl-username').textContent = 'Yönetici Kullanıcı Adı';
                    document.getElementById('username').value = '';
                    document.getElementById('password').value = '';
                    document.getElementById('username').placeholder = 'Yönetici adı (Örn: admin)';
                } else {
                    document.getElementById('form-title').textContent = '✍️ Yazar Girişi';
                    document.getElementById('lbl-username').textContent = 'Yazar Kullanıcı Adı';
                    document.getElementById('username').value = '';
                    document.getElementById('password').value = '';
                    document.getElementById('username').placeholder = 'Kullanıcı adı (Örn: ali.dayioglu)';
                }
            }
        }

        function showRoles() {
            document.getElementById('role-selection').style.display = 'block';
            document.getElementById('login-form-area').style.display = 'none';
        }

        async function submitLogin() {
            const usernameInput = document.getElementById('username').value.trim();
            const passwordInput = document.getElementById('password').value.trim();
            const errBox = document.getElementById('err-box');

            if (!usernameInput || !passwordInput) {
                errBox.textContent = 'Lütfen kullanıcı adı ve şifrenizi girin.';
                errBox.style.display = 'block';
                return;
            }

            errBox.style.display = 'none';

            let loginSuccess = false;
            let loginData = null;

            // 1. Sunucu API Üzerinden Kimlik Doğrulama
            // sunucuKarar: sunucuya ULAŞILDI ve o karar verdi mi? Ulaşıldıysa
            // sunucunun "hayır"ı KESİNDİR — aşağıdaki çevrimdışı yedek akış
            // devreye girmez (bkz. o bloğun başındaki not).
            let sunucuKarar = false;
            try {
                const apiUrl = '/api/login';
                const res = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        role: selectedRole,
                        username: usernameInput,
                        password: passwordInput
                    })
                });

                sunucuKarar = true;
                if (res.ok) {
                    loginData = await res.json();
                    if (loginData && loginData.success) {
                        loginSuccess = true;
                    }
                }
            } catch (e) {
                console.warn('Sunucu API çağrısı yapılamadı, yerel doğrulama kontrol ediliyor:', e);
            }

            /* 2. Çevrimdışı / Yerel Doğrulama — YALNIZCA sunucuya ulaşılamadığında.

               2026-08-06'da düzeltilen SESSİZ HATA: bu blok yazar girişinde
               kullanıcı adına HİÇ BAKMIYOR, sadece şifre 'mektep123' mi diye
               soruyordu. Üstelik sunucu isteği reddettiğinde de çalışıyordu.
               Sonuç: var olmayan/yanlış yazılmış bir kullanıcı adı (örn.
               "erdal.kilic" yerine "erdal.kılıç") başarıyla "giriş yapıyor",
               authorRealName o uydurma ada ayarlanıyor ve kütüphane hiçbir
               kartla eşleşemediği için yazar BOMBOŞ bir raf görüyordu.
               Kullanıcının "yazarın yazıları görünmüyor" şikâyetinin sebebi
               buydu — giriş başarısız olduğunu söylemiyordu bile.
               Artık: (a) sunucu karar verdiyse buraya hiç girilmez,
               (b) çevrimdışı modda kullanıcı adı, üretilen gerçek yazar
               kullanıcı adları listesinden doğrulanır. */
            if (!loginSuccess && !sunucuKarar) {
                const uName = usernameInput.trim().toLocaleLowerCase('tr');
                const pwd = passwordInput;
                const validAdminUsernames = ['erdem.ozkur', 'admin', 'yonetici', 'mektep'];
                const validAdminPasswords = ['erdem.123', 'admin123', 'mektep123', 'admin', '123456'];

                if (selectedRole === 'admin') {
                    if (validAdminUsernames.includes(uName) && validAdminPasswords.includes(pwd)) {
                        loginSuccess = true;
                        loginData = { success: true, role: 'admin' };
                    }
                } else if (selectedRole === 'author') {
                    // YAZAR_KULLANICILARI build_library.js tarafından üretilir
                    // (yazar_kullanicilari.js). Dosya yoksa eski davranışa
                    // düşmek yerine giriş reddedilir — sessiz boş raf yerine
                    // açık hata mesajı verilir.
                    const kayit = (window.YAZAR_KULLANICILARI || {})[uName];
                    if (kayit && (pwd === 'mektep123' || pwd === 'admin123')) {
                        loginSuccess = true;
                        loginData = {
                            success: true,
                            role: 'author',
                            authorName: kayit.name,
                            authorId: kayit.id
                        };
                    }
                }
            }

            if (loginSuccess) {
                localStorage.setItem('userRole', selectedRole);
                localStorage.setItem('username', usernameInput);
                localStorage.setItem('password', passwordInput);

                if (selectedRole === 'author' && loginData) {
                    if (loginData.authorName) localStorage.setItem('authorRealName', loginData.authorName);
                    if (loginData.authorId) localStorage.setItem('authorId', loginData.authorId);
                }

                // Yönlendirme: Yönetici ise Yönetim Paneline, değilse Kütüphaneye
                if (selectedRole === 'admin') {
                    window.location.href = 'mektep_yonetim.html';
                } else {
                    window.location.href = 'mektep_kutuphane.html';
                }
            } else {
                if (selectedRole === 'author') {
                    const uName = usernameInput.trim().toLocaleLowerCase('tr');
                    const liste = window.YAZAR_KULLANICILARI || null;
                    if (liste && !liste[uName]) {
                        const benzer = Object.keys(liste)
                            .filter(k => k.split('.').some(p => uName.split('.').includes(p)))
                            .slice(0, 3);
                        errBox.textContent = '"' + usernameInput + '" adında bir yazar kullanıcısı bulunamadı.'
                            + (benzer.length ? ' Bunu mu demek istediniz: ' + benzer.join(' , ') + ' ?' : ' Kullanıcı adınızı yöneticiden öğrenebilirsiniz.');
                    } else {
                        errBox.textContent = 'Hatalı yazar şifresi! Lütfen şifrenizi kontrol edip tekrar deneyin.';
                    }
                } else {
                    errBox.textContent = 'Hatalı yönetici kullanıcı adı veya şifre!';
                }
                errBox.style.display = 'block';
            }
        }

        // Enter tuşu ile giriş
        document.addEventListener('keydown', e => {
            if (e.key === 'Enter' && document.getElementById('login-form-area').style.display === 'block') {
                submitLogin();
            }
        });
    </script>
    <footer style="position: fixed; bottom: 0; left: 0; right: 0; text-align: center; padding: 14px 20px; color: #6b7280; font-size: 0.75rem; letter-spacing: 0.3px; z-index: 20;">
        <div>© <span id="footer-yil"></span> ÖZKURBİR Mektep Kütüphanesi</div>
        <div style="margin-top: 4px; opacity: 0.75;">Powered By Mehmet Kutlu</div>
    </footer>
    <script>document.getElementById('footer-yil').textContent = new Date().getFullYear();</script>
</body>
</html>
